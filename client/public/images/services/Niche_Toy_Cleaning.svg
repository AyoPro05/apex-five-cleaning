<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Cleaned children's toys with Posh loaner pram from Apex Five Cleaning">
  <defs>
    <linearGradient id="bgToys" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="pramHood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="pramFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="sparkle2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgToys)"/>

  <!-- soft blobs -->
  <circle cx="700" cy="120" r="80" fill="#fdba74" opacity="0.3"/>
  <circle cx="90" cy="480" r="70" fill="#fdba74" opacity="0.25"/>

  <!-- Posh loaner pram (left side) -->
  <g transform="translate(80,200)">
    <!-- shadow -->
    <ellipse cx="140" cy="280" rx="120" ry="12" fill="#0f766e" opacity="0.15"/>
    <!-- frame -->
    <path d="M60 270 Q60 180 110 170 L170 170 Q220 180 220 270"
          fill="none" stroke="url(#pramFrame)" stroke-width="13" stroke-linecap="round"/>
    <!-- hood (posh teal) -->
    <path d="M210 175 Q230 70 150 65 Q80 65 70 175 Z" fill="url(#pramHood)"/>
    <path d="M85 90 Q140 70 195 90" stroke="#5eead4" stroke-width="3" fill="none" opacity="0.6"/>
    <!-- seat -->
    <path d="M80 175 Q90 120 140 118 Q190 120 200 175 Z" fill="#fef3c7"/>
    <!-- handle -->
    <path d="M215 175 Q245 165 250 140" stroke="#111827" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- wheels -->
    <circle cx="100" cy="280" r="42" fill="#111827"/>
    <circle cx="100" cy="280" r="28" fill="#374151"/>
    <circle cx="100" cy="280" r="10" fill="#5eead4"/>
    <circle cx="190" cy="280" r="42" fill="#111827"/>
    <circle cx="190" cy="280" r="28" fill="#374151"/>
    <circle cx="190" cy="280" r="10" fill="#5eead4"/>
    <!-- loaner label -->
    <g transform="translate(50,-15)">
      <rect x="0" y="0" width="180" height="34" rx="17" fill="#0d9488"/>
      <text x="90" y="23" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">POSH LOANER PRAM</text>
    </g>
  </g>

  <!-- Toys cluster (right side) -->
  <g transform="translate(420,180)">
    <!-- wooden stacking rings -->
    <g transform="translate(120,80)">
      <ellipse cx="0" cy="60" rx="80" ry="14" fill="#0f766e" opacity="0.15"/>
      <circle cx="0" cy="38" r="38" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
      <circle cx="0" cy="18" r="28" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
      <circle cx="0" cy="2" r="20" fill="#0d9488" stroke="#0f766e" stroke-width="3"/>
      <rect x="-3" y="-30" width="6" height="78" rx="3" fill="#a16207"/>
      <circle cx="0" cy="-32" r="8" fill="#fde68a" stroke="#a16207" stroke-width="2"/>
    </g>

    <!-- plush teddy -->
    <g transform="translate(40,200)">
      <circle cx="0" cy="40" r="48" fill="#d97706"/>
      <circle cx="-30" cy="0" r="20" fill="#d97706"/>
      <circle cx="30" cy="0" r="20" fill="#d97706"/>
      <circle cx="-30" cy="0" r="11" fill="#92400e"/>
      <circle cx="30" cy="0" r="11" fill="#92400e"/>
      <circle cx="0" cy="35" r="20" fill="#fef3c7"/>
      <circle cx="-8" cy="32" r="3" fill="#1f2937"/>
      <circle cx="8" cy="32" r="3" fill="#1f2937"/>
      <ellipse cx="0" cy="42" rx="5" ry="3" fill="#1f2937"/>
    </g>

    <!-- rubber duck -->
    <g transform="translate(250,210)">
      <ellipse cx="0" cy="20" rx="48" ry="22" fill="#facc15"/>
      <circle cx="-30" cy="-5" r="22" fill="#facc15"/>
      <path d="M-50 -5 L-68 -8 L-50 5 Z" fill="#f97316"/>
      <circle cx="-35" cy="-10" r="3" fill="#1f2937"/>
      <ellipse cx="10" cy="-5" rx="6" ry="4" fill="#fde68a"/>
    </g>

    <!-- building blocks -->
    <g transform="translate(180,260)">
      <rect x="-30" y="-30" width="38" height="38" rx="4" fill="#0d9488" stroke="#0f766e" stroke-width="2"/>
      <rect x="6" y="-30" width="38" height="38" rx="4" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
      <rect x="-12" y="-66" width="38" height="38" rx="4" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
      <text x="-11" y="-6" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
      <text x="25" y="-6" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
      <text x="7" y="-42" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>
    </g>
  </g>

  <!-- sparkle highlights -->
  <g fill="#fcd34d">
    <path d="M380 150 L386 168 L404 174 L386 180 L380 198 L374 180 L356 174 L374 168 Z"/>
    <path d="M620 410 L624 422 L636 426 L624 430 L620 442 L616 430 L604 426 L616 422 Z" opacity="0.8"/>
  </g>
  <circle cx="370" cy="430" r="40" fill="url(#sparkle2)"/>
  <circle cx="600" cy="180" r="35" fill="url(#sparkle2)"/>

  <!-- badge -->
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="220" height="48" rx="24" fill="#0d9488"/>
    <text x="110" y="31" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">APEX FIVE · TOY CLEAN</text>
  </g>
</svg>
